<title>큐브몬 월드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: full-screen voxel world; Minecraft-style bevelled stone GUI panels float over it. Single committed look. */
:root{
  --sky:#9fd0ff;
  --panel:#c6c6c6; --panel-hi:#ffffff; --panel-lo:#555555; --edge:#111111;
  --ink:#2b2b2b; --ink-soft:#5b5b5b; --ink-inv:#ffffff;
  --slot:#8b8b8b; --slot-lo:#373737;
  --stone:#7d7d7d; --stone-hi:#acacac; --stone-lo:#4c4c4c;
  --grass:#5aa83a; --grass-hi:#8fd46a; --grass-lo:#2f6b1c;
  --gold:#f2c230; --danger:#c8452d; --xp:#7ee03a; --scrim:rgba(10,14,20,.6);
  --f-ui:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-num:"Silkscreen","Courier New",monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
button{font-family:var(--f-ui);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* Bevel panel */
.panel{background:var(--panel);border:3px solid;border-color:var(--panel-hi) var(--panel-lo) var(--panel-lo) var(--panel-hi);box-shadow:0 0 0 3px var(--edge)}
.mcbtn{background:var(--stone);color:var(--ink-inv);font-size:17px;padding:10px 14px;border:3px solid;border-color:var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);box-shadow:0 0 0 2px var(--edge);text-shadow:2px 2px 0 #333;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.mcbtn:active{border-color:var(--stone-lo) var(--stone-hi) var(--stone-hi) var(--stone-lo)}
.mcbtn.go{background:var(--grass);border-color:var(--grass-hi) var(--grass-lo) var(--grass-lo) var(--grass-hi)}
.mcbtn.warn{background:var(--danger);border-color:#e98a76 #7a2516 #7a2516 #e98a76}
.mcbtn[disabled]{opacity:.45;cursor:not-allowed}
.slot{background:var(--slot);border:2px solid;border-color:var(--slot-lo) var(--panel-hi) var(--panel-hi) var(--slot-lo)}

/* Map HUD */
#mapHud,#encHud{position:fixed;inset:0;pointer-events:none}
#mapHud>*,#encHud>*{pointer-events:auto}
#trainer{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;color:var(--ink);font-size:16px;text-align:left}
#trainer .face{width:38px;height:38px;flex:none;background:
  linear-gradient(#4a3424 0 30%,transparent 30%),
  linear-gradient(90deg,transparent 18%,#fff 18% 34%,transparent 34% 66%,#fff 66% 82%,transparent 82%) 0 48%/100% 14% no-repeat,
  linear-gradient(90deg,transparent 22%,#2c3a6b 22% 32%,transparent 32% 68%,#2c3a6b 68% 78%,transparent 78%) 0 48%/100% 14% no-repeat,
  #d9a27a;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
#trainer .lv{font-size:13px;color:var(--ink-soft)}
#trainer .lv b{font-family:var(--f-num);font-size:16px;color:var(--ink)}
.xpbar{display:block;width:92px;height:8px;background:var(--slot-lo);margin-top:4px;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;background:var(--xp);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
#res{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;padding:6px 10px;font-size:14px;display:grid;gap:2px;text-align:right}
#res b{font-family:var(--f-num);font-size:13px}
#toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 76px);left:50%;transform:translateX(-50%);padding:8px 14px;font-size:16px;max-width:calc(100% - 32px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#nearby{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);padding:6px;width:100px}
#nearby .lbl{font-size:13px;color:var(--ink-soft);margin:0 0 4px 2px}
#nearList{display:grid;grid-template-columns:repeat(2,42px);gap:4px}
#nearList .s{width:42px;height:42px;display:grid;place-items:center}
#nearList img{width:38px;height:38px}
#nearList img.unk{filter:brightness(0);opacity:.55}
#joy{position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;background:var(--panel);border:3px solid;border-color:var(--panel-hi) var(--panel-lo) var(--panel-lo) var(--panel-hi);box-shadow:0 0 0 2px var(--edge)}
#menuBtn{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);width:78px;height:78px;padding:0;display:grid;place-items:center;background:var(--panel);border:3px solid;border-color:var(--panel-hi) var(--panel-lo) var(--panel-lo) var(--panel-hi);box-shadow:0 0 0 3px var(--edge)}
#hintMap{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 84px);transform:translateX(-50%);font-size:14px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;white-space:nowrap;pointer-events:none}

/* Cube-ball icon (original design: cube with dark band and glowing core) */
.cube{--c1:#2fb7a5;--c2:#1d1d1d;--c3:#b8fff5;width:30px;height:30px;position:relative;display:inline-block;flex:none;background:linear-gradient(var(--c1) 0 40%,var(--c2) 40% 60%,var(--c1) 60%);box-shadow:inset 0 0 0 3px rgba(0,0,0,.28),inset 4px 4px 0 rgba(255,255,255,.25)}
.cube::after{content:"";position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);background:var(--c3);box-shadow:0 0 0 2px var(--c2)}
#menuBtn .cube{width:44px;height:44px}
.cube.great{--c1:#c9d3dc;--c2:#2a4e8a;--c3:#8fd0ff}
.cube.ultra{--c1:#2b2b2b;--c2:#f2c230;--c3:#ffe08a}
.berry{width:26px;height:26px;display:inline-block;position:relative;background:radial-gradient(circle at 35% 35%,#ffd36b 0 18%,transparent 19%),#e8452d;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.berry::before{content:"";position:absolute;left:35%;top:-6px;width:30%;height:7px;background:#3f8a2c}

/* Encounter HUD */
#runBtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px}
#encTitle{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);padding:8px 16px;text-align:center;min-width:150px}
#encName{font-size:20px;display:flex;gap:6px;align-items:center;justify-content:center}
#encCp{font-size:14px;color:var(--ink-soft);margin-top:2px}
#encCp b{font-family:var(--f-num);font-size:18px;color:var(--ink)}
#throwMsg{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:38px;color:#fff;text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;pointer-events:none;opacity:0;transition:opacity .2s}
#throwMsg.on{opacity:1}
#hint{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 96px);text-align:center;color:#fff;font-size:16px;text-shadow:0 2px 0 #000,0 0 6px #000;pointer-events:none}
.encBottom{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;justify-content:space-between;pointer-events:none}
.encBottom .mcbtn{pointer-events:auto;font-size:15px}
.encBottom b{font-family:var(--f-num);font-size:14px}
.berryOn{outline:3px solid var(--gold);outline-offset:2px}

/* Screens */
.screen{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:10}
.sheet{width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;min-height:0}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;gap:10px}
.sheet h2{margin:0;font-weight:400;font-size:24px;text-wrap:balance}
.sheet .sub{font-size:14px;color:var(--ink-soft)}
.sheet .body{padding:4px 14px 14px;overflow-y:auto;min-height:0}
.x{background:var(--stone);color:#fff;width:40px;height:40px;font-size:18px;border:3px solid;border-color:var(--stone-hi) var(--stone-lo) var(--stone-lo) var(--stone-hi);box-shadow:0 0 0 2px var(--edge);flex:none}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{padding:6px 4px 8px;text-align:center;background:var(--slot);border:2px solid;border-color:var(--slot-lo) var(--panel-hi) var(--panel-hi) var(--slot-lo);color:#fff;text-shadow:1px 1px 0 #333;font-size:15px;position:relative;min-width:0}
.card img{width:100%;max-width:84px;aspect-ratio:1;display:block;margin:0 auto}
.card .cp{font-family:var(--f-num);font-size:12px}
.card .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .star{position:absolute;top:4px;right:6px;color:var(--gold)}
.card .shn{position:absolute;top:4px;left:6px;color:#ffe08a}
.card.unk img{filter:brightness(0);opacity:.45}
.card .no{font-family:var(--f-num);font-size:11px;opacity:.8}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
select{font-family:var(--f-ui);font-size:15px;padding:6px 8px;background:var(--panel-hi);color:var(--ink);border:2px solid var(--panel-lo)}
.menuGrid{display:grid;gap:10px;padding:6px 14px 16px}
.menuGrid .mcbtn{justify-content:flex-start;font-size:19px;padding:12px 16px}
.menuGrid .mcbtn small{margin-left:auto;font-size:14px;opacity:.9}
.typechip{display:inline-block;padding:2px 8px;font-size:13px;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.det{display:grid;gap:12px}
.det .hero{display:grid;place-items:center;padding:10px;background:linear-gradient(#bfe3ff,#e9f6ff 70%,#9fcf7a 70%)}
.det .hero img{width:180px;height:180px;max-width:100%}
.det .cpbig{font-family:var(--f-num);font-size:28px;text-align:center}
.det .cpbig small{font-family:var(--f-ui);font-size:16px;color:var(--ink-soft);margin-right:6px}
.hpbar{height:10px;background:var(--slot-lo)}
.hpbar i{display:block;height:100%;width:100%;background:#4fd36a}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center}
.stats>div{padding:8px 4px}
.stats b{display:block;font-family:var(--f-num);font-size:15px}
.stats span{font-size:13px;color:var(--ink-soft)}
.ivrow{display:grid;grid-template-columns:44px 1fr 34px;gap:8px;align-items:center;font-size:14px}
.ivbar{height:10px;background:var(--slot-lo);display:grid;grid-template-columns:repeat(15,1fr);gap:1px;padding:1px}
.ivbar i{background:transparent}
.ivbar i.on{background:var(--gold)}
.ivbar.max i.on{background:#ff7a59}
.stars{color:var(--gold);font-size:18px;letter-spacing:2px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.acts .mcbtn{flex-direction:column;gap:2px;font-size:17px}
.acts .mcbtn small{font-size:12px;opacity:.95}
.bagrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px;margin-bottom:6px}
.bagrow .ic{display:grid;place-items:center}
.bagrow b{font-family:var(--f-num);font-size:16px}
.bagrow p{margin:2px 0 0;font-size:13px;color:var(--ink-soft)}
.loot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:44px;margin:10px 0}
.loot span{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;font-size:15px;animation:pop .35s ease-out both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.towerCube{width:120px;height:120px;margin:12px auto;background:linear-gradient(#5be9d6 0 40%,#1d1d1d 40% 60%,#2fb7a5 60%);box-shadow:inset 0 0 0 6px rgba(0,0,0,.25),inset 10px 10px 0 rgba(255,255,255,.3),0 0 40px rgba(91,233,214,.7);position:relative;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.towerCube::after{content:"";position:absolute;inset:40%;background:#d6fffa;box-shadow:0 0 0 4px #1d1d1d}
.towerCube.used{filter:hue-rotate(95deg) saturate(.8);box-shadow:inset 0 0 0 6px rgba(0,0,0,.25),inset 10px 10px 0 rgba(255,255,255,.3)}
.center{text-align:center}
.reslist{display:grid;gap:6px;margin:10px 0}
.reslist div{display:flex;justify-content:space-between;padding:8px 12px;font-size:16px}
.reslist b{font-family:var(--f-num);font-size:14px}
.newtag{display:inline-block;background:var(--gold);color:#3a2a00;padding:2px 8px;font-size:13px;margin-left:6px}
.starterGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.starterGrid button{padding:8px 4px}
.starterGrid img{width:100%;max-width:96px;aspect-ratio:1}
.lead{font-size:16px;line-height:1.55;margin:4px 0 0;color:var(--ink)}
.small{font-size:13px;color:var(--ink-soft);line-height:1.5}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--sky);z-index:20;font-size:22px;color:#fff;text-shadow:2px 2px 0 #2b5a8a}
@media (prefers-reduced-motion:reduce){.loot span{animation:none}.towerCube{transition:none}}
</style>

<div id="stage"></div>

<div id="mapHud" hidden>
  <button id="trainer" class="panel" aria-label="트레이너 정보">
    <span class="face"></span>
    <span><span class="lv">레벨 <b id="lvN">1</b></span><span class="xpbar"><i id="xpFill" style="width:0%"></i></span></span>
  </button>
  <div id="res" class="panel"><span>볼 <b id="resBall">0</b></span><span>결정 <b id="resDust">0</b></span></div>
  <div id="toast" class="panel" hidden></div>
  <div id="nearby" class="panel"><div class="lbl">근처</div><div id="nearList"></div></div>
  <div id="hintMap">큐브몬·보급탑 탭 · 드래그로 회전</div>
  <div id="joy" aria-label="이동 조이스틱"><div id="knob"></div></div>
  <button id="menuBtn" aria-label="메뉴 열기"><span class="cube"></span></button>
</div>

<div id="encHud" hidden>
  <button id="runBtn" class="mcbtn">도망가기</button>
  <div id="encTitle" class="panel"><div id="encName"></div><div id="encCp"></div></div>
  <div id="throwMsg"></div>
  <div id="hint">큐브를 위로 밀어서 던지세요</div>
  <div class="encBottom">
    <button id="berryBtn" class="mcbtn"><span class="berry"></span>꿀딸기 <b id="berryN">0</b></button>
    <button id="ballBtn" class="mcbtn"><span id="ballIc" class="cube"></span><span id="ballName">큐브볼</span> <b id="ballN">0</b></button>
  </div>
</div>

<div id="menu" class="screen" hidden>
  <div class="sheet panel">
    <header><h2>메뉴</h2><button class="x" data-close aria-label="닫기">✕</button></header>
    <div class="menuGrid">
      <button class="mcbtn" data-open="coll">내 몬스터 <small id="mCount"></small></button>
      <button class="mcbtn" data-open="dex">도감 <small id="mDex"></small></button>
      <button class="mcbtn" data-open="bag">가방 <small id="mBag"></small></button>
      <button class="mcbtn" data-open="profile">트레이너 정보</button>
    </div>
  </div>
</div>

<div id="coll" class="screen" hidden>
  <div class="sheet panel">
    <header><div><h2>내 몬스터</h2><div class="sub" id="collSub"></div></div><button class="x" data-close aria-label="닫기">✕</button></header>
    <div class="body">
      <div class="tools"><label class="small" for="sortSel">정렬</label>
        <select id="sortSel"><option value="recent">최근 포획</option><option value="cp">CP 높은 순</option><option value="no">도감 번호</option><option value="fav">즐겨찾기</option></select></div>
      <div id="collGrid" class="grid3"></div>
    </div>
  </div>
</div>

<div id="detail" class="screen" hidden>
  <div class="sheet panel">
    <header><h2 id="dName"></h2><button class="x" data-close aria-label="닫기">✕</button></header>
    <div class="body det" id="dBody"></div>
  </div>
</div>

<div id="dex" class="screen" hidden>
  <div class="sheet panel">
    <header><div><h2>도감</h2><div class="sub" id="dexSub"></div></div><button class="x" data-close aria-label="닫기">✕</button></header>
    <div class="body"><div id="dexGrid" class="grid3"></div></div>
  </div>
</div>

<div id="bag" class="screen" hidden>
  <div class="sheet panel">
    <header><div><h2>가방</h2><div class="sub" id="bagSub"></div></div><button class="x" data-close aria-label="닫기">✕</button></header>
    <div class="body" id="bagBody"></div>
  </div>
</div>

<div id="profile" class="screen" hidden>
  <div class="sheet panel">
    <header><h2>트레이너 정보</h2><button class="x" data-close aria-label="닫기">✕</button></header>
    <div class="body" id="profBody"></div>
  </div>
</div>

<div id="tower" class="screen" hidden>
  <div class="sheet panel">
    <header><div><h2>보급탑</h2><div class="sub" id="towerSub"></div></div><button class="x" data-close aria-label="닫기">✕</button></header>
    <div class="body center">
      <div id="towerCube" class="towerCube"></div>
      <div id="loot" class="loot"></div>
      <button id="spinBtn" class="mcbtn go">큐브 돌리기</button>
    </div>
  </div>
</div>

<div id="result" class="screen" hidden>
  <div class="sheet panel">
    <header><h2 id="rTitle">포획 성공!</h2></header>
    <div class="body center" id="rBody"></div>
  </div>
</div>

<div id="levelup" class="screen" hidden>
  <div class="sheet panel">
    <header><h2 id="luTitle">레벨 업!</h2></header>
    <div class="body center" id="luBody"></div>
  </div>
</div>

<div id="starter" class="screen" hidden>
  <div class="sheet panel">
    <header><h2>첫 번째 파트너 고르기</h2></header>
    <div class="body">
      <p class="lead">블록으로 이루어진 세계에 큐브몬들이 살고 있어요. 함께 모험할 첫 큐브몬을 골라 큐브볼로 잡아보세요.</p>
      <div class="starterGrid" id="starterGrid"></div>
    </div>
  </div>
</div>

<div id="loading">세계를 쌓는 중…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mod=(a,n)=>((a%n)+n)%n;
const easeOut=k=>1-(1-k)*(1-k);

if(typeof THREE==='undefined'){ $('#loading').textContent='3D 엔진을 불러오지 못했어요. 새로고침 해주세요.'; return; }

/* ---------------- Data ---------------- */
const TYPES={grass:{n:'풀',c:'#4f9a32'},fire:{n:'불꽃',c:'#d8611f'},water:{n:'물',c:'#2f78bd'},electric:{n:'전기',c:'#c9a20c'},rock:{n:'바위',c:'#7b7b82'},normal:{n:'노말',c:'#9c8a6c'}};
// Original creatures. stats are GO-style base Attack/Defense/Stamina; bcr = base capture rate; flee = flee rate
const SPECIES=[

/* ---------------- Noise / terrain ---------------- */
const CH=24, RAD=2;
function hash2(x,z,s){let h=(Math.imul(x|0,374761393)+Math.imul(z|0,668265263)+Math.imul(s|0,982451653))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(x,z,s){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);const a=hash2(xi,zi,s),b=hash2(xi+1,zi,s),c=hash2(xi,zi+1,s),d=hash2(xi+1,zi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,z,s){return vnoise(x,z,s)*.6+vnoise(x*2.1,z*2.1,s+7)*.3+vnoise(x*4.3,z*4.3,s+13)*.1;}
function tileAt(x,z){
  const h=fbm(x/38,z/38,11),t=fbm(x/95+50,z/95,23),m=fbm(x/70,z/70+30,37);
  let type,b,hh=0;
  if(h<.33){type='water';b='water';hh=-1;}
  else if(h<.37){type='sand';b='shore';}
  else if(h>.70){type='stone';b='stone';hh=h>.78?2:1;}
  else if(t>.6&&m<.48){type='sand';b='sand';}
  else if(t<.37){type='snow';b='snow';}
  else if(m>.57){type='grass';b='forest';}
  else{type='grass';b='grass';}
  const road=mod(x,CH)<2||mod(z,CH)<2;
  if(road){if(type==='water'){type='plank';}else{type='path';}hh=0;}
  return{type,b,h:hh,road};
}
function groundY(x,z){const T=tileAt(Math.floor(x),Math.floor(z));return T.type==='water'?-0.35:T.h;}

const matCache={};
function lam(c,opt){const k=c+(opt?JSON.stringify(opt):'');if(!matCache[k])matCache[k]=new THREE.MeshLambertMaterial(Object.assign({color:c},opt||{}));return matCache[k];}
const GLOW=c=>({emissive:c,emissiveIntensity:.7});
function shiftC(hex){const c=new THREE.Color(hex);c.offsetHSL(.42,0,.02);return'#'+c.getHexString();}
function buildMon(sid,shiny){
  const S=SPECIES[sid];let c1=S.c1,c2=S.c2,c3=S.c3;
  if(shiny){c1=shiftC(c1);if(S.type!=='normal')c3=shiftC(c3);else c1=shiftC('#e7d6a8');}
  const V=.1*S.size,g=new THREE.Group(),body=new THREE.Group();g.add(body);
  const P={body,wings:[],flame:null,tail:null,arms:[],hover:false};
  const f=n=>S.feats.includes(n);
  const B=(par,w,h,d,c,x,y,z,opt)=>{const m=new THREE.Mesh(BOX,lam(c,opt));m.scale.set(w*V,h*V,d*V);m.position.set(x*V,y*V,z*V);par.add(m);return m;};
  const eyes=(y,z,dx,s)=>{s=s||1.4;for(const k of[-1,1]){B(body,s,s*1.2,.4,'#1b1b1b',k*dx,y,z);B(body,s*.45,s*.45,.45,'#ffffff',k*dx-.3*s,y+.3*s,z+.05);}};
  let H=10,R=5,CY=5;
  if(S.shape==='quad'){
    const wool=f('wool'),hc=wool?c2:c1,lc=wool?c2:c1;
    for(const sx of[-1,1])for(const sz of[-1,1])B(body,2,4,2,lc,sx*2.5,2,sz*3.5);
    if(wool){B(body,10,8,12,c1,0,7.5,0);B(body,5,2,4,c1,0,15.8,6.5);}
    else{B(body,8,6,10,c1,0,7,0);B(body,5,4,.6,c2,0,7,5.1);}
    B(body,7,7,7,hc,0,11.5,6.5);
    B(body,3,2,1.2,wool?'#3a3532':c2,0,10.2,10.4);
    B(body,1,.7,.3,'#1b1b1b',0,10.6,11.05);
    eyes(12.4,10.05,1.9);
    if(f('earsLong'))for(const k of[-1,1]){B(body,1.6,5,1.2,c1,k*2,17,6);B(body,.8,3.4,.3,c3,k*2,17,6.65);}
    if(f('earsPointy'))for(const k of[-1,1]){B(body,2.2,3,1.4,c1,k*2.3,16.2,6);B(body,2.2,1,1.45,'#2b2b2b',k*2.3,17.3,6);}
    if(f('earsSmall'))for(const k of[-1,1])B(body,2.5,1.2,1.5,c2,k*4.2,12.6,6);
    const tail=new THREE.Group();tail.position.set(0,8.5*V,-5*V);body.add(tail);P.tail=tail;
    B(tail,2,2,4,wool?c1:c1,0,0,-1.6);
    if(f('sprout')){B(body,.8,2.5,.8,c3,0,16.2,6.5);for(const k of[-1,1])B(body,3.2,.6,1.6,'#9be267',k*1.6,17.6,6.5);}
    if(f('mane'))B(body,9,8,3,c3,0,11.5,3.2);
    if(f('horns'))for(const k of[-1,1]){B(body,1,5,1,'#7a5230',k*2.6,17.5,4.5);B(body,2.2,1,1,'#7a5230',k*3.6,19,4.5);B(body,1.4,1.4,1.4,'#9be267',k*4.6,19.6,4.5);}
    if(f('flameTail')){const fl=new THREE.Group();fl.position.set(0,1.5*V,-4*V);tail.add(fl);B(fl,3,3,3,c3,0,0,0,GLOW(c3));B(fl,1.8,1.8,1.8,'#fff3a0',0,2,-.4,GLOW('#fff3a0'));P.flame=fl;}
    if(f('flameMane')){B(body,10,3,3,c3,0,15.8,4.6,GLOW(c3));for(const k of[-1,0,1])B(body,1.6,2.4,1.6,'#fff3a0',k*3,18,4.6,GLOW('#fff3a0'));}
    H=f('horns')?20.5:f('earsLong')?19.5:17;R=6;CY=9;
  }else if(S.shape==='blob'){
    const yb=f('feet')?1.5:0;
    if(f('feet'))for(const k of[-1,1])B(body,2.5,1.5,3,c2,k*2.5,.75,1.5);
    B(body,9,8,9,c1,0,4+yb,0);B(body,6,4.5,.6,c2,0,3.6+yb,4.55);
    eyes(5.8+yb,4.6,2);B(body,2,.6,.3,'#1b1b1b',0,3.8+yb,4.75);
    H=8+yb;CY=4+yb;R=5;
    if(f('drop')){B(body,5,3,5,c1,0,9.5,0);B(body,2.6,2,2.6,c1,0,12,0);B(body,1.2,1.6,1.2,c2,0,13.6,0);B(body,1.4,1.4,.4,'#ffffff',2.6,6.6,4.6);H=14.4;CY=6;}
    if(f('lumps')){B(body,3,2.5,3,c2,3,8.6+yb,-1);B(body,2.5,2,2.5,c2,-3,8.3+yb,1);B(body,2,2,2,c3,0,9+yb,-2.5);H=10.5+yb;}

    for(const sx of[-1,1])for(const sz of[-1,1])B(body,3,3,3,c1,sx*4,1.5,sz*4);
    B(body,10,2,12,c3,0,3.5,0);B(body,11,5,13,c2,0,6.5,-.5);B(body,7,2,9,c2,0,9.8,-.5);

    B(body,5,5,6,c1,0,5,8.5);eyes(6,11.55,1.4,1.1);B(body,2,1.5,3,c1,0,3.5,-7.5);

    if(f('stripes'))for(const z of[-1.2,1.8])B(body,6.2,6.2,1.4,c2,0,yb+3,z);
    B(body,6,5.5,5,c1,0,yb+4,6);eyes(yb+4.6,8.55,1.6,1.3);

    for(const k of[-1,1]){const wp=new THREE.Group();wp.position.set(k*3*V,(yb+6.5)*V,0);body.add(wp);B(wp,6,.4,4,c3,k*3,0,0,{transparent:true,opacity:.75});wp.userData.k=k;P.wings.push(wp);}
    if(f('stinger'))B(body,1.4,1.4,3,c3,0,yb+2.5,-5.5,GLOW(c3));
    if(f('crown'))for(const x of[-1.6,0,1.6])B(body,1.1,x===0?1.8:1.2,1.1,'#ffe36b',x,yb+7.3+(x===0?.3:0),6,GLOW('#ffe36b'));
    H=yb+10.5;CY=yb+3.5;R=6;
  }else if(S.shape==='golem'){
    for(const k of[-1,1])B(body,3,5,3,c2,k*2.6,2.5,0);
    B(body,10,9,7,c1,0,9.5,0);B(body,3,3,.6,c3,0,10,3.6,GLOW(c3));

function buildChunk(cx,cz){
  const L={};const add=(k,x,y,z,sx,sy,sz)=>{(L[k]||(L[k]=[])).push(x,y,z,sx||1,sy||1,sz||1);};
  const ox=cx*CH,oz=cz*CH;
  const hasTower=hash2(cx,cz,9)<.55&&tileAt(ox+3,oz+3).type!=='water';
  for(let lx=0;lx<CH;lx++)for(let lz=0;lz<CH;lz++){
    const wx=ox+lx,wz=oz+lz,T=tileAt(wx,wz),x=wx+.5,z=wz+.5;
    if(T.type==='water'){add('water',x,-.65,z,1,1,1);add('sand',x,-1.5,z);continue;}
    if(T.type==='stone'){for(let k=0;k<T.h;k++)add('stone',x,k+.5,z);add('stone',x,-.5,z);}
    else add(T.type,x,-.5,z);
    if(T.road)continue;
    if(lx<3||lx>21||lz<3||lz>21)continue;
    if(hasTower&&lx<=5&&lz<=5)continue;
    const r=hash2(wx,wz,5),top=T.h;
    if((T.b==='forest'&&r<.06)||(T.b==='grass'&&r<.01)){
      for(let k=0;k<4;k++)add('log',x,top+k+.5,z);
      for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){add('leaves',x+dx,top+3.5,z+dz);add('leaves',x+dx,top+4.5,z+dz);}
      for(const[dx,dz]of[[-2,0],[2,0],[0,-2],[0,2]])add('leaves',x+dx,top+3.5,z+dz);
      add('leaves',x,top+5.5,z);
    }else if(T.b==='snow'&&r<.03){
      for(let k=0;k<3;k++)add('log',x,top+k+.5,z);
      for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)add('spruce',x+dx,top+2.5,z+dz);
      add('spruce',x,top+3.5,z);add('spruce',x,top+4.5,z,.6,1,.6);
    }else if(T.b==='sand'&&r<.012){const n=2+(r*1000|0)%2;for(let k=0;k<n;k++)add('cactus',x,top+k+.5,z,.8,1,.8);}
    else if((T.b==='grass'||T.b==='forest')&&r<.08){const r2=hash2(wx,wz,6);add(r2<.4?'flowerR':r2<.75?'flowerY':'flowerW',x,top+.18,z,.22,.32,.22);}
  }
  const group=new THREE.Group();
  for(const k in L){const a=L[k],n=a.length/6,mesh=new THREE.InstancedMesh(BOX,BMAT[k],n);
    for(let i=0;i<n;i++){D.position.set(a[i*6],a[i*6+1],a[i*6+2]);D.scale.set(a[i*6+3],a[i*6+4],a[i*6+5]);D.updateMatrix();mesh.setMatrixAt(i,D.matrix);}
    mesh.instanceMatrix.needsUpdate=true;mesh.matrixAutoUpdate=false;group.add(mesh);}
  scene.add(group);
  const key=cx+','+cz;let tw=null;
  if(hasTower)tw=makeTower(key,ox+3.5,tileAt(ox+3,oz+3).h,oz+3.5);
  chunks.set(key,{group,tw});
}

/* ---------------- Map update ---------------- */
let T0=0,spawnT=0,nearT=0,posT=0;
function updateMap(dt){
  let ix=joy.x,iy=joy.y;
  if(!anyScreen()){if(keys.w||keys.arrowup)iy=-1;if(keys.s||keys.arrowdown)iy=1;if(keys.a||keys.arrowleft)ix=-1;if(keys.d||keys.arrowright)ix=1;}
  const mag=Math.min(1,Math.hypot(ix,iy)),U=player.userData;
  if(mag>.1&&!anyScreen()){
    const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
    let mx=rx*ix+fx*(-iy),mz=rz*ix+fz*(-iy);const l=Math.hypot(mx,mz)||1;mx/=l;mz/=l;
    const sp=6.5*mag*dt;player.position.x+=mx*sp;player.position.z+=mz*sp;save.stats.km+=sp/1000;
    const target=Math.atan2(mx,mz);let dr=target-player.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));player.rotation.y+=dr*Math.min(1,dt*12);
    const sw=Math.sin(T0*11)*.7*mag;U.legs[0].rotation.x=sw;U.legs[1].rotation.x=-sw;U.arms[0].rotation.x=-sw;U.arms[1].rotation.x=sw;
  }else{for(const p of[...U.legs,...U.arms])p.rotation.x*=.8;}
  const gy=groundY(player.position.x,player.position.z);player.position.y+=(gy-player.position.y)*Math.min(1,dt*10);
  rangeRing.position.set(player.position.x,Math.max(gy,-.1)+.06,player.position.z);
  const P=player.position;
  cam.position.set(P.x+Math.sin(yaw)*camDist,P.y+camH,P.z+Math.cos(yaw)*camDist);cam.lookAt(P.x,P.y+1,P.z);
  // chunks
  const pcx=Math.floor(P.x/CH),pcz=Math.floor(P.z/CH);let built=0;
  for(let r=0;r<=RAD&&built<1;r++)for(let dx=-r;dx<=r&&built<1;dx++)for(let dz=-r;dz<=r&&built<1;dz++){const k=(pcx+dx)+','+(pcz+dz);if(!chunks.has(k)){buildChunk(pcx+dx,pcz+dz);built++;}}
  for(const k of chunks.keys()){const[a,b]=k.split(',').map(Number);if(Math.abs(a-pcx)>RAD+1||Math.abs(b-pcz)>RAD+1)dropChunk(k);}
  // spawns
  spawnT-=dt;if(spawnT<=0){spawnT=rand(2,4);if(wilds.length<10)spawnWild();}
  for(let i=wilds.length-1;i>=0;i--){const w=wilds[i],d=Math.hypot(w.g.position.x-P.x,w.g.position.z-P.z);
    if(d>58||T0-w.born>w.life){removeWild(w);continue;}
    if(w.grow<1){w.grow=Math.min(1,w.grow+dt*2.5);w.g.scale.setScalar(easeOut(w.grow));}
    animMon(w.m,T0,w.ph);w.m.rotation.y=Math.atan2(P.x-w.g.position.x,P.z-w.g.position.z);}
  const now=Date.now();
  for(const tw of towers.values()){tw.cube.rotation.y+=dt*1.2;tw.cube.position.y=3.7+Math.sin(T0*2+tw.x)*.12;const used=(save.stops[tw.key]||0)>now;tw.cm.color.set(used?0x9a6bd8:0x2fb7a5);tw.cm.emissive.set(used?0x5a3b88:0x2fb7a5);}
  for(const c of clouds){c.position.x+=dt*1.2;if(c.position.x>P.x+90)c.position.x-=180;if(c.position.x<P.x-90)c.position.x+=180;if(c.position.z>P.z+90)c.position.z-=180;if(c.position.z<P.z-90)c.position.z+=180;}
  nearT-=dt;if(nearT<=0){nearT=1;renderNearby();}
  posT-=dt;if(posT<=0){posT=5;save.pos=[P.x,P.z];persist();}
}
function renderNearby(){
  const P=player.position;
  const L=wilds.map(w=>({w,d:Math.hypot(w.g.position.x-P.x,w.g.position.z-P.z)})).filter(o=>o.d<45).sort((a,b)=>a.d-b.d).slice(0,4);
  const html=L.map(o=>{const c=save.dex[o.w.sp]&&save.dex[o.w.sp].caught;return`<div class="s slot"><img class="${c?'':'unk'}" alt="" src="${thumb(o.w.sp,false)}"></div>`;}).join('')+'<div class="s slot"></div>'.repeat(4-L.length);
  const el=$('#nearList');if(el.dataset.h!==html){el.innerHTML=html;el.dataset.h=html;}
}

function updEncHud(){

  const t=enc.ballType;$('#ballName').textContent=t?BALLS[t].n:'큐브 없음';$('#ballN').textContent=t?save.items[t]:0;$('#ballIc').className='cube '+(t?BALLS[t].cls:'');
  const p=catchProb(enc.w,1),col=p>.6?0x4fd36a:p>.35?0xf2d43a:p>.15?0xf28a2e:0xe0443a;ringInner.material.color.setHex(col);
}
function catchProb(w,throwMult){
  if(w.forceCatch)return 1;
  const S=SPECIES[w.sp],base=Math.min(1,S.bcr/(2*cpm(w.lvl)));
  const mult=(enc.ballType?BALLS[enc.ballType].m:1)*(enc.berry?1.5:1)*throwMult;
  return 1-Math.pow(1-base,mult);
}

  enc.ballType=availBall(enc.ballType||'ball');updEncHud();

const drag={on:false,id:null,pts:[]};
const plane=new THREE.Plane(new THREE.Vector3(0,0,1),-B0.z),tmpV=new THREE.Vector3();
function encDown(e){if(enc.phase!=='aim'||!enc.ball||anyScreen())return;if(e.clientY<innerHeight*.5)return;drag.on=true;drag.id=e.pointerId;drag.pts=[{x:e.clientX,y:e.clientY,t:performance.now()}];cv.setPointerCapture(e.pointerId);}
function encMove(e){if(!drag.on||e.pointerId!==drag.id)return;drag.pts.push({x:e.clientX,y:e.clientY,t:performance.now()});if(drag.pts.length>12)drag.pts.shift();
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,encCam);if(ray.ray.intersectPlane(plane,tmpV)){enc.ball.position.set(clamp(tmpV.x,-1.2,1.2),clamp(tmpV.y,.5,1.8),B0.z);}}
function encCancel(){if(drag.on){drag.on=false;if(enc.ball&&enc.phase==='aim')enc.ball.position.copy(B0);}}
function encUp(e){
  if(!drag.on||e.pointerId!==drag.id)return;drag.on=false;
  const now=performance.now(),n=drag.pts.length,b=drag.pts[n-1];let a=drag.pts.find(p=>now-p.t<140);if(!a||a===b)a=drag.pts[Math.max(0,n-2)];
  const dt=Math.max(.016,(b.t-a.t)/1000),vys=-(b.y-a.y)/dt/innerHeight,vxs=(b.x-a.x)/dt/innerWidth;
  if(vys<.45){enc.ball.position.copy(B0);return;}
  throwBall(vxs,vys);
}
function throwBall(vxs,vys){
  enc.phase='flying';save.items[enc.ballType]--;save.thrown=true;$('#hint').hidden=true;persist();updEncHud();sfx.throw();
  enc.v=new THREE.Vector3(clamp(vxs*2.2,-5,5),clamp(vys*1.45,.5,9),-11.5);enc.bounced=false;enc.checked=false;enc.flyT=0;
}
function updateEnc(dt){
  const m=enc.mon;if(!m)return;
  // ring cycle
  if(enc.phase==='aim'||enc.phase==='flying'){enc.ring=(enc.ring+dt/2.2)%1;}
  const rs=1-enc.ring*.85;
  const bob=m.userData.P.hover?Math.sin(T0*3)*.08:0;
  ringOuter.visible=ringInner.visible=(enc.phase==='aim'||enc.phase==='flying');
  ringOuter.position.set(0,enc.cy+bob,MZ+enc.R*.5);ringInner.position.copy(ringOuter.position);ringInner.scale.setScalar(enc.R*rs);
  if(enc.phase!=='capture')animMon(m,T0,0);
  const b=enc.ball;
  if(enc.phase==='aim'&&b&&!drag.on){b.rotation.y+=dt*.8;b.position.y=B0.y+Math.sin(T0*3)*.03;}
  if(enc.phase==='flying'&&b){
    enc.flyT+=dt;const pz=b.position.z;
    enc.v.y-=9.8*dt;b.position.addScaledVector(enc.v,dt);b.rotation.x-=dt*14;
    const planeZ=MZ+enc.R*.5;
    if(!enc.checked&&pz>planeZ&&b.position.z<=planeZ){
      enc.checked=true;const cy=enc.cy+bob,d=Math.hypot(b.position.x,b.position.y-cy);
      if(d<enc.R*1.05){
        const inner=enc.R*rs;let q={m:1,label:'',xp:0};
        if(d<inner){const s=rs;q=s>.7?{m:1+(1-s)*.9,label:'나이스!',xp:10}:s>.4?{m:1.3+(.7-s),label:'그레이트!',xp:50}:{m:1.7+(.4-s)*.75,label:'엑설런트!',xp:100};}
        sfx.hit();if(q.label)showMsg(q.label);doCapture(q);return;
      }
    }
    if(b.position.y<.15&&!enc.bounced){enc.bounced=true;enc.v.y=Math.abs(enc.v.y)*.35;enc.v.z*=.5;enc.v.x*=.5;}
    if(enc.flyT>1.6||b.position.y<-1){encScene.remove(b);enc.ball=null;enc.phase='miss';showMsg('빗나갔다');setTimeout(()=>{if(mode==='enc'&&enc.phase==='miss')spawnBall();},450);}
  }
}
async function doCapture(q){
  enc.phase='capture';const b=enc.ball,m=enc.mon,w=enc.w;
  const hitPos=b.position.clone(),top=new THREE.Vector3(0,enc.cy+.9,MZ+enc.R*.7);
  await tween(.28,k=>{b.position.lerpVectors(hitPos,top,easeOut(k));b.rotation.x=-k*6;});
  b.rotation.set(0,0,0);
  flash.position.set(0,enc.cy,MZ);flash.visible=true;
  await tween(.3,k=>{m.scale.setScalar(Math.max(.001,1-k));flash.scale.setScalar(enc.R*2*(1-k*.6));flash.material.opacity=.85*(1-k);});
  m.visible=false;flash.visible=false;
  const gp=new THREE.Vector3(0,.16,MZ+enc.R*.7);
  await tween(.35,k=>{b.position.lerpVectors(top,gp,k*k);});
  const p=catchProb(w,q.m),ok=Math.random()<p,wob=ok?3:randi(0,2);
  for(let i=0;i<wob;i++){await sleep(260);sfx.wob();await tween(.6,k=>{b.rotation.z=Math.sin(k*Math.PI*2)*.45;});b.rotation.z=0;}
  await sleep(320);
  if(ok){
    sfx.ok();showMsg('잡았다!');
    stars.forEach((s,i)=>{s.visible=true;s.position.copy(b.position);});
    await tween(.7,k=>{stars.forEach((s,i)=>{const a=i/stars.length*Math.PI*2;s.position.set(b.position.x+Math.cos(a)*k*.9,b.position.y+.2+Math.sin(k*Math.PI)*.6,b.position.z+Math.sin(a)*k*.3);});b.userData.core.material=lam('#ffe36b',GLOW('#ffe36b'));});
    stars.forEach(s=>s.visible=false);
    finishCatch(q);
  }else{
    sfx.fail();encScene.remove(b);enc.ball=null;m.visible=true;
    await tween(.25,k=>m.scale.setScalar(Math.max(.001,k)));
    showMsg('앗, 빠져나왔다!');enc.berry=false;updEncHud();
    if(!w.forceCatch&&Math.random()<SPECIES[w.sp].flee){
      await sleep(700);showMsg('도망쳤다…');
      await tween(.5,k=>{m.position.y=k*2;m.scale.setScalar(Math.max(.001,1-k));});
      await sleep(500);endEncounter(true);
    }else{await sleep(500);if(mode==='enc')spawnBall();}
  }
}
function finishCatch(q){
  enc.phase='done';const w=enc.w,S=SPECIES[w.sp];
  const isNew=!(save.dex[w.sp]&&save.dex[w.sp].caught);
  const mon={id:save.nextId++,sp:w.sp,lvl:w.lvl,iv:w.iv,shiny:w.shiny,fav:false,t:Date.now()};
  save.mons.push(mon);markSeen(w.sp);save.dex[w.sp].caught++;save.stats.caught++;
  const candy=S.stage===1?3:S.stage===2?5:10,dust=100*S.stage;
  save.candy[S.line]=(save.candy[S.line]||0)+candy;save.dust+=dust;
  const xp=100+q.xp+(isNew?500:0);
  if(w.starter)save.started=true;
  $('#rTitle').innerHTML=`${S.name} 포획!${isNew?'<span class="newtag">도감 등록</span>':''}`;
  $('#rBody').innerHTML=`<img alt="" src="${thumb(w.sp,w.shiny)}" style="width:140px;height:140px;max-width:100%"><div class="cpbig num" style="font-size:24px">CP ${calcCP(mon)}</div>
   <div class="reslist"><div class="slot" style="background:var(--panel)"><span>경험치</span><b>+${xp}</b></div><div class="slot" style="background:var(--panel)"><span>결정조각</span><b>+${dust}</b></div><div class="slot" style="background:var(--panel)"><span>${S.name.slice(0,2)} 젤리</span><b>+${candy}</b></div></div>
   <div class="acts"><button class="mcbtn" id="rView">자세히 보기</button><button class="mcbtn go" id="rOk">확인</button></div>`;
  openScreen('result');
  const done=()=>{closeScreen('result');endEncounter(true);addXP(xp);flushLevelUp();};
  $('#rOk').onclick=done;
  $('#rView').onclick=()=>{done();curDetail=mon.id;renderDetail();openScreen('detail');};
  persist();
}
function endEncounter(removeW){
  const w=enc.w;mode='map';
  if(enc.ball){encScene.remove(enc.ball);enc.ball=null;}
  if(enc.mon){encScene.remove(enc.mon);enc.mon=null;}
  enc.phase='idle';
  if(removeW&&w&&!w.starter)removeWild(w);
  $('#encHud').hidden=true;$('#mapHud').hidden=false;updHud();
  if(w&&w.starter&&!save.started)startStarter();
}

/* Starter */
function startStarter(){
  $('#starterGrid').innerHTML=[0,3,5].map(i=>`<button class="mcbtn" data-st="${i}" style="flex-direction:column"><img alt="" src="${thumb(i,false)}"><span>${SPECIES[i].name}</span>${typeChip(SPECIES[i].type)}</button>`).join('');
  openScreen('starter');
}
$('#starterGrid').addEventListener('click',e=>{const b=e.target.closest('[data-st]');if(!b)return;const sp=+b.dataset.st;closeScreen('starter');
  startEncounter({id:0,sp,lvl:1,iv:newIV(),shiny:false,biome:'grass',forceCatch:true,starter:true});});

/* ---------------- Loop & boot ---------------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;T0+=dt;
  tickTweens(dt);
  if(mode==='map'){updateMap(dt);renderer.render(scene,cam);}
  else{updateEnc(dt);renderer.render(encScene,encCam);}
}
function findStart(){for(let r=0;r<80;r+=2)for(let a=0;a<8;a++){const x=12+Math.cos(a)*r,z=12+Math.sin(a)*r,T=tileAt(Math.floor(x),Math.floor(z));if(T.b==='grass'&&T.h===0&&!T.road)return[x,z];}return[12,12];}

function boot(data){
  save=loadSave(data&&data.save);
  try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({save}));}catch(e){}
  const p=save.pos||findStart();player.position.set(p[0],groundY(p[0],p[1]),p[1]);
  resize();addEventListener('resize',resize);
  // prebuild center chunk so the first frame isn't empty
  const pcx=Math.floor(p[0]/CH),pcz=Math.floor(p[1]/CH);
  for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)buildChunk(pcx+dx,pcz+dz);
  for(let i=0;i<6;i++)spawnWild();
  wilds.forEach(w=>{w.grow=1;w.g.scale.setScalar(1);});
  updHud();$('#loading').hidden=true;$('#mapHud').hidden=false;
  requestAnimationFrame(frame);
  if(!save.started)startStarter();
  setTimeout(()=>{$('#hintMap').hidden=true;},15000);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(boot);else boot((hot&&hot.data)||{});
})();
</script>
